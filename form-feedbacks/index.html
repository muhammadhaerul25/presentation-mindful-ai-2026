<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Feedback - Mindful AI 2026</title>
    <link
      rel="icon"
      type="image/jpeg"
      href="../assets/logo/logo-yayasan-khouw-kalbe.jpg"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #34a853;
        --primary-dark: #0d8246;
        --error: #d93025;
        --bg: #f0f4f9;
        --surface: #ffffff;
        --text: #202124;
        --text-muted: #5f6368;
        --border: #dadce0;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background-color: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
      }

      .container {
        background: var(--surface);
        max-width: 640px;
        width: 100%;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        position: relative;
        overflow: hidden;
        margin-bottom: 40px;
      }

      /* Google forms style colored top border */
      .container::before {
        content: "";
        display: block;
        height: 10px;
        width: 100%;
        background: linear-gradient(to right, #0d8246, #34a853);
      }

      .content-padding {
        padding: 40px;
      }

      .header {
        text-align: center;
        margin-bottom: 32px;
      }

      .header h2 {
        font-size: 20px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 8px;
      }

      .header h1 {
        font-size: 28px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 16px;
        line-height: 1.3;
      }

      .header p {
        font-size: 14px;
        color: var(--text-muted);
        line-height: 1.6;
      }

      .form-group {
        margin-bottom: 24px;
      }

      .form-group > label, .form-group .group-label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 12px;
        color: var(--text);
      }

      .form-group > label.required::after, .form-group .group-label.required::after {
        content: " *";
        color: var(--error);
      }

      .form-control {
        width: 100%;
        padding: 12px 16px;
        font-size: 15px;
        border: 1px solid var(--border);
        border-radius: 6px;
        transition: all 0.2s ease;
        outline: none;
        background: #ffffff;
        color: var(--text);
        font-family: "Inter", sans-serif;
      }

      .form-control::placeholder {
        color: #9aa0a6;
      }

      .form-control:hover {
        border-color: #b9babc;
      }

      .form-control:focus {
        border-color: var(--primary);
        border-width: 2px;
        padding: 11px 15px; /* offset the 2px border so it doesn't jump */
      }

      textarea.form-control {
        resize: vertical;
        min-height: 100px;
        line-height: 1.5;
      }

      .rating-group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .rating-group input[type="radio"] {
        display: none;
      }

      .rating-group label {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border: 1px solid var(--border);
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
        font-size: 15px;
        color: var(--text-muted);
        background: #ffffff;
        transition: all 0.2s;
      }

      .rating-group label:hover {
        background: #f8f9fa;
      }

      .rating-group input[type="radio"]:checked + label {
        background: #e6f4ea;
        color: var(--primary);
        border-color: var(--primary);
        font-weight: 600;
      }

      .btn-submit {
        width: 100%;
        padding: 14px;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: var(--primary);
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin-top: 32px;
      }

      .btn-submit:hover:not(:disabled) {
        background: var(--primary-dark);
      }

      .btn-submit:disabled {
        background: #94a3b8;
        cursor: not-allowed;
      }

      .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 1s linear infinite;
        display: none;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @media (max-width: 600px) {
        body { padding: 20px 16px; }
        .content-padding { padding: 32px 24px; }
        .header h1 { font-size: 24px; }
        .rating-group label { width: 36px; height: 36px; font-size: 14px; }
      }

      .alert {
        padding: 12px 16px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 24px;
        display: none;
      }
      .alert.error {
        background: #fce8e6;
        color: #d93025;
        border: 1px solid #fad2cf;
        display: block;
      }

      #successState {
        display: none;
        text-align: center;
        padding: 20px 0;
      }

      .success-icon {
        width: 64px;
        height: 64px;
        background: #e6f4ea;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
        color: #137333;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="content-padding">
        <div class="header">
          <h2>Form Feedback</h2>
          <h1>Materi Mindful AI: AI Personalization for Student Productivity</h1>
          <p>
            Materi akan dikirimkan via email kepada peserta yang telah submit form feedback berikut.
          </p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="feedbackForm">
          <div class="form-group">
            <label for="nama" class="required">Nama Lengkap</label>
            <input type="text" id="nama" class="form-control" placeholder="Contoh: Budi Santoso" required />
          </div>

          <div class="form-group">
            <label for="email" class="required">Email</label>
            <input type="email" id="email" class="form-control" placeholder="Contoh: budi@example.com" required />
          </div>

          <div class="form-group">
            <div class="group-label required">Berikan nilai rating materi ini</div>
            <div class="rating-group">
              <input type="radio" name="rating" id="rating1" value="1" required><label for="rating1">1</label>
              <input type="radio" name="rating" id="rating2" value="2"><label for="rating2">2</label>
              <input type="radio" name="rating" id="rating3" value="3"><label for="rating3">3</label>
              <input type="radio" name="rating" id="rating4" value="4"><label for="rating4">4</label>
              <input type="radio" name="rating" id="rating5" value="5"><label for="rating5">5</label>
              <input type="radio" name="rating" id="rating6" value="6"><label for="rating6">6</label>
              <input type="radio" name="rating" id="rating7" value="7"><label for="rating7">7</label>
              <input type="radio" name="rating" id="rating8" value="8"><label for="rating8">8</label>
              <input type="radio" name="rating" id="rating9" value="9"><label for="rating9">9</label>
              <input type="radio" name="rating" id="rating10" value="10"><label for="rating10">10</label>
            </div>
          </div>

          <div class="form-group">
            <label for="alasan" class="required">Alasan memberikan nilai tersebut</label>
            <textarea id="alasan" class="form-control" placeholder="Tuliskan alasan Anda..." required></textarea>
          </div>

          <div class="form-group">
            <label for="pesan" class="required">Pesan dan Kesan untuk Pemateri</label>
            <textarea id="pesan" class="form-control" placeholder="Tuliskan pesan dan kesan Anda..." required></textarea>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">
            <span id="submitText">Submit</span>
            <div class="spinner" id="loadingSpinner"></div>
          </button>
        </form>

        <div id="successState">
          <div class="success-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <h2 style="font-size: 24px; font-weight: 700; color: #202124; margin-bottom: 12px;">Terima Kasih!</h2>
          <p style="font-size: 15px; color: #5f6368; line-height: 1.6; margin-bottom: 32px;">
            Feedback Anda telah berhasil dikirim. Materi akan segera dikirimkan ke email Anda.
          </p>
          <button onclick="window.location.reload()" style="background: transparent; color: #0d8246; border: none; font-weight: 600; font-size: 15px; cursor: pointer; padding: 8px 16px; border-radius: 4px; transition: background 0.2s;" onmouseover="this.style.background = '#e6f4ea';" onmouseout="this.style.background = 'transparent';">
            Kirim Feedback Lain
          </button>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById("feedbackForm");
      const submitBtn = document.getElementById("submitBtn");
      const submitText = document.getElementById("submitText");
      const loadingSpinner = document.getElementById("loadingSpinner");
      const successState = document.getElementById("successState");
      const alertBox = document.getElementById("alertBox");

      function showAlert(message, type) {
        alertBox.textContent = message;
        alertBox.className = `alert ${type}`;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const nama = document.getElementById("nama").value.trim();
        const email = document.getElementById("email").value.trim();
        const ratingInput = document.querySelector('input[name="rating"]:checked');
        const rating = ratingInput ? ratingInput.value : null;
        const alasan = document.getElementById("alasan").value.trim();
        const pesan = document.getElementById("pesan").value.trim();

        if (!nama || !email || !rating || !alasan || !pesan) {
          showAlert("Mohon lengkapi semua kolom.", "error");
          return;
        }

        submitBtn.disabled = true;
        submitText.style.display = "none";
        loadingSpinner.style.display = "block";
        alertBox.className = "alert";

        try {
          const apiUrl = window.location.protocol === "file:" 
            ? "https://mindful-ai-2026.vercel.app/api/submit_feedback" 
            : "/api/submit_feedback";
            
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nama, email, rating, alasan, pesan }),
          });

          const result = await response.json();

          if (!response.ok) {
             throw new Error(result.error || "Terjadi kesalahan saat submit data.");
          }

          form.style.display = "none";
          document.querySelector(".header").style.display = "none";
          alertBox.style.display = "none";
          successState.style.display = "block";
          form.reset();
        } catch (error) {
          console.error(error);
          showAlert(`Gagal menyimpan: ${error.message}`, "error");
        } finally {
          submitBtn.disabled = false;
          submitText.style.display = "block";
          loadingSpinner.style.display = "none";
        }
      });
    </script>
  </body>
</html>
