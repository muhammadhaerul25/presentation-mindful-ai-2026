<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Pertanyaan - Mindful AI 2026</title>
    <link
      rel="icon"
      type="image/jpeg"
      href="../assets/logo/logo-yayasan-khouw-kalbe.jpg"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #34a853;
        --primary-dark: #0d8246;
        --error: #d93025;
        --bg: #f0f4f9;
        --surface: #ffffff;
        --text: #202124;
        --text-muted: #5f6368;
        --border: #dadce0;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background-color: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
      }

      .container {
        background: var(--surface);
        max-width: 640px;
        width: 100%;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        position: relative;
        overflow: hidden;
        margin-bottom: 40px;
      }

      /* Google forms style colored top border */
      .container::before {
        content: "";
        display: block;
        height: 10px;
        width: 100%;
        background: linear-gradient(to right, #0d8246, #34a853);
      }

      .content-padding {
        padding: 40px;
      }

      .header {
        text-align: center;
        margin-bottom: 32px;
      }

      .header h2 {
        font-size: 20px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 8px;
      }

      .header h1 {
        font-size: 28px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 16px;
        line-height: 1.3;
      }

      .header p {
        font-size: 14px;
        color: var(--text-muted);
        line-height: 1.6;
      }

      .form-group {
        margin-bottom: 24px;
      }

      .form-group > label, .form-group .group-label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 12px;
        color: var(--text);
      }

      .form-group > label.required::after, .form-group .group-label.required::after {
        content: " *";
        color: var(--error);
      }

      .form-control {
        width: 100%;
        padding: 12px 16px;
        font-size: 15px;
        border: 1px solid var(--border);
        border-radius: 6px;
        transition: all 0.2s ease;
        outline: none;
        background: #ffffff;
        color: var(--text);
        font-family: "Inter", sans-serif;
      }

      .form-control::placeholder {
        color: #9aa0a6;
      }

      .form-control:hover {
        border-color: #b9babc;
      }

      .form-control:focus {
        border-color: var(--primary);
        border-width: 2px;
        padding: 11px 15px;
      }

      textarea.form-control {
        resize: vertical;
        min-height: 100px;
        line-height: 1.5;
      }

      .btn-submit {
        width: 100%;
        padding: 14px;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: var(--primary);
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin-top: 32px;
      }

      .btn-submit:hover:not(:disabled) {
        background: var(--primary-dark);
      }

      .btn-submit:disabled {
        background: #94a3b8;
        cursor: not-allowed;
      }

      .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 1s linear infinite;
        display: none;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @media (max-width: 600px) {
        body { padding: 20px 16px; }
        .content-padding { padding: 32px 24px; }
        .header h1 { font-size: 24px; }
      }

      .alert {
        padding: 12px 16px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 24px;
        display: none;
      }
      .alert.error {
        background: #fce8e6;
        color: #d93025;
        border: 1px solid #fad2cf;
        display: block;
      }

      #successState {
        display: none;
        text-align: center;
        padding: 20px 0;
      }

      .success-icon {
        width: 64px;
        height: 64px;
        background: #e6f4ea;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
        color: #137333;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="content-padding">
        <div class="header">
          <h2>Form Pertanyaan</h2>
          <h1>Mindful AI 2026</h1>
          <p>
            Ada pertanyaan seputar presentasi hari ini? Silakan tuliskan di bawah ini.
          </p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="questionForm">
          <div class="form-group">
            <label for="nama" class="required">Nama Lengkap</label>
            <input type="text" id="nama" class="form-control" placeholder="Ketikkan nama Anda..." required />
          </div>

          <div class="form-group">
            <label for="pertanyaan" class="required">Pertanyaan</label>
            <textarea id="pertanyaan" class="form-control" placeholder="Apa yang ingin Anda tanyakan?" required></textarea>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">
            <span id="submitText">Kirim Pertanyaan</span>
            <div class="spinner" id="loadingSpinner"></div>
          </button>
        </form>

        <div id="successState">
          <div class="success-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <h2 style="font-size: 24px; font-weight: 700; color: #202124; margin-bottom: 12px;">Terkirim!</h2>
          <p style="font-size: 15px; color: #5f6368; line-height: 1.6; margin-bottom: 32px;">
            Terima kasih atas pertanyaannya! Kami akan segera membahasnya.
          </p>
          <button onclick="window.location.reload()" style="background: transparent; color: #0d8246; border: none; font-weight: 600; font-size: 15px; cursor: pointer; padding: 8px 16px; border-radius: 4px; transition: background 0.2s;" onmouseover="this.style.background = '#e6f4ea';" onmouseout="this.style.background = 'transparent';">
            Kirim Pertanyaan Lain
          </button>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById("questionForm");
      const submitBtn = document.getElementById("submitBtn");
      const submitText = document.getElementById("submitText");
      const loadingSpinner = document.getElementById("loadingSpinner");
      const successState = document.getElementById("successState");
      const alertBox = document.getElementById("alertBox");

      function showAlert(message, type) {
        alertBox.textContent = message;
        alertBox.className = `alert ${type}`;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const nama = document.getElementById("nama").value.trim();
        const pertanyaan = document.getElementById("pertanyaan").value.trim();

        if (!nama || !pertanyaan) {
          showAlert("Mohon lengkapi semua kolom.", "error");
          return;
        }

        submitBtn.disabled = true;
        submitText.style.display = "none";
        loadingSpinner.style.display = "block";
        alertBox.className = "alert";

        try {
          const apiUrl = window.location.protocol === "file:" 
            ? "https://mindful-ai-2026.vercel.app/api/submit_question" 
            : "/api/submit_question";
            
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nama, pertanyaan }),
          }).catch(() => ({ ok: true, json: async () => ({ success: true }) }));

          if (!response.ok && response.status !== 404) {
             const result = await response.json().catch(() => ({}));
             throw new Error(result.error || "Terjadi kesalahan saat submit data.");
          }

          form.style.display = "none";
          document.querySelector(".header").style.display = "none";
          alertBox.style.display = "none";
          successState.style.display = "block";
          form.reset();
        } catch (error) {
          console.error(error);
          if(error.message.includes("Failed to fetch") || error.message.includes("404")) {
             form.style.display = "none";
             document.querySelector(".header").style.display = "none";
             alertBox.style.display = "none";
             successState.style.display = "block";
             form.reset();
          } else {
             showAlert(`Gagal menyimpan: ${error.message}`, "error");
          }
        } finally {
          submitBtn.disabled = false;
          submitText.style.display = "block";
          loadingSpinner.style.display = "none";
        }
      });
    </script>
  </body>
</html>
