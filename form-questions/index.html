<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Pertanyaan - Mindful AI 2026</title>
    <link
      rel="icon"
      type="image/jpeg"
      href="../assets/logo/logo-yayasan-khouw-kalbe.jpg"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #34a853;
        --primary-dark: #0d8246;
        --success: #34a853;
        --error: #ea4335;
        --bg: #0f172a; /* Dark sleek background for the premium feel */
        --surface: rgba(255, 255, 255, 0.95);
        --text: #1e293b;
        --text-muted: #64748b;
        --border: #e2e8f0;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background-color: var(--bg);
        background-image:
          radial-gradient(
            circle at 15% 50%,
            rgba(52, 168, 83, 0.15),
            transparent 25%
          ),
          radial-gradient(
            circle at 85% 30%,
            rgba(13, 130, 70, 0.15),
            transparent 25%
          );
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
        overflow: hidden;
      }

      /* Animated background orbs */
      body::before,
      body::after {
        content: "";
        position: absolute;
        width: 40vmax;
        height: 40vmax;
        border-radius: 50%;
        background: linear-gradient(
          135deg,
          rgba(52, 168, 83, 0.2),
          rgba(13, 130, 70, 0.2)
        );
        filter: blur(80px);
        z-index: -1;
        animation: float 10s infinite ease-in-out alternate;
      }
      body::before {
        top: -10vmax;
        left: -10vmax;
      }
      body::after {
        bottom: -10vmax;
        right: -10vmax;
        animation-delay: -5s;
        background: linear-gradient(
          135deg,
          rgba(13, 130, 70, 0.2),
          rgba(52, 168, 83, 0.2)
        );
      }

      @keyframes float {
        0% {
          transform: translate(0, 0) scale(1);
        }
        100% {
          transform: translate(5%, 5%) scale(1.1);
        }
      }

      .container {
        background: var(--surface);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        max-width: 520px;
        width: 100%;
        border-radius: 32px;
        padding: 48px 40px;
        box-shadow:
          0 24px 48px rgba(0, 0, 0, 0.2),
          0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        position: relative;
        animation: scaleUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes scaleUp {
        0% {
          opacity: 0;
          transform: scale(0.95) translateY(20px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      .header {
        text-align: center;
        margin-bottom: 36px;
      }

      .header h1 {
        font-size: 32px;
        font-weight: 900;
        background: linear-gradient(135deg, #0d8246, #34a853);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 12px;
        letter-spacing: -0.02em;
      }

      .header p {
        font-size: 16px;
        color: var(--text-muted);
        line-height: 1.6;
        font-weight: 500;
      }

      .form-group {
        margin-bottom: 24px;
        position: relative;
      }

      .form-group > label {
        display: block;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #334155;
        transition: color 0.3s ease;
      }

      .form-group:focus-within > label {
        color: var(--primary-dark);
      }

      .form-group > label::after {
        content: " *";
        color: var(--error);
      }

      .form-control {
        width: 100%;
        padding: 16px 20px;
        font-size: 16px;
        border: 2px solid var(--border);
        border-radius: 16px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        outline: none;
        background: #f8fafc;
        color: var(--text);
        font-family: "Inter", sans-serif;
      }

      .form-control::placeholder {
        color: #94a3b8;
        font-weight: 400;
      }

      .form-control:hover {
        background: #ffffff;
        border-color: #cbd5e1;
      }

      .form-control:focus {
        border-color: var(--primary);
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(52, 168, 83, 0.15);
      }

      textarea.form-control {
        resize: vertical;
        min-height: 140px;
        line-height: 1.5;
      }

      .btn-submit {
        width: 100%;
        padding: 18px;
        font-size: 17px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg, #0d8246, #34a853);
        background-size: 200% auto;
        border: none;
        border-radius: 16px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin-top: 32px;
        box-shadow: 0 10px 20px -10px rgba(13, 130, 70, 0.5);
      }

      .btn-submit:hover:not(:disabled) {
        background-position: right center;
        transform: translateY(-3px);
        box-shadow: 0 15px 30px -10px rgba(13, 130, 70, 0.6);
      }

      .btn-submit:active:not(:disabled) {
        transform: translateY(0);
        box-shadow: 0 5px 10px -5px rgba(13, 130, 70, 0.5);
      }

      .btn-submit:disabled {
        background: #94a3b8;
        box-shadow: none;
        cursor: not-allowed;
        transform: none;
      }

      /* Loading Spinner */
      .spinner {
        width: 22px;
        height: 22px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        display: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 600px) {
        body {
          padding: 16px;
        }
        .container {
          padding: 32px 20px;
          border-radius: 24px;
        }
        .header h1 {
          font-size: 24px;
        }
        .header p {
          font-size: 14px;
        }
        .form-control {
          padding: 14px 16px;
          font-size: 15px;
        }
        .btn-submit {
          padding: 16px;
          font-size: 16px;
        }
        .success-icon {
          width: 70px;
          height: 70px;
          margin-bottom: 24px;
        }
        .success-icon svg {
          width: 36px;
          height: 36px;
        }
        /* Update inline styles via specificity */
        #successState h2 {
          font-size: 24px !important;
        }
        #successState p {
          font-size: 14px !important;
          margin-bottom: 24px !important;
        }
        #successState button {
          width: 100%;
          padding: 16px !important;
        }
      }

      /* Success & Alert states */
      .alert {
        padding: 16px 20px;
        border-radius: 16px;
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 24px;
        display: none;
        animation: fadeIn 0.4s ease;
      }
      .alert.error {
        background: #fef2f2;
        color: #dc2626;
        border: 1px solid #fca5a5;
        display: block;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      #successState {
        display: none;
        text-align: center;
        padding: 30px 0 10px;
        animation: scaleUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .success-icon {
        width: 90px;
        height: 90px;
        background: linear-gradient(135deg, #dcfce7, #bbf7d0);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 32px;
        color: #16a34a;
        box-shadow: 0 10px 25px -5px rgba(34, 197, 94, 0.2);
        animation: popIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes popIn {
        0% {
          transform: scale(0) rotate(-45deg);
        }
        70% {
          transform: scale(1.1) rotate(10deg);
        }
        100% {
          transform: scale(1) rotate(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Mindful AI 2026</h1>
        <p>
          Ada pertanyaan seputar presentasi hari ini? Silakan tuliskan di bawah
          ini.
        </p>
      </div>

      <div id="alertBox" class="alert"></div>

      <form id="questionForm">
        <div
          class="form-group"
          style="
            animation: fadeIn 0.6s ease forwards;
            opacity: 0;
            transform: translateY(10px);
            animation-delay: 0.1s;
          "
        >
          <label for="nama">Nama Lengkap</label>
          <input
            type="text"
            id="nama"
            class="form-control"
            placeholder="Ketikkan nama Anda..."
            required
          />
        </div>

        <div
          class="form-group"
          style="
            animation: fadeIn 0.6s ease forwards;
            opacity: 0;
            transform: translateY(10px);
            animation-delay: 0.2s;
          "
        >
          <label for="pertanyaan">Pertanyaan</label>
          <textarea
            id="pertanyaan"
            class="form-control"
            placeholder="Apa yang ingin Anda tanyakan?"
            required
          ></textarea>
        </div>

        <button
          type="submit"
          class="btn-submit"
          id="submitBtn"
          style="
            animation: fadeIn 0.6s ease forwards;
            opacity: 0;
            transform: translateY(10px);
            animation-delay: 0.3s;
          "
        >
          <span id="submitText">Kirim Pertanyaan</span>
          <div class="spinner" id="loadingSpinner"></div>
        </button>
      </form>

      <div id="successState">
        <div class="success-icon">
          <svg
            width="48"
            height="48"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <h2
          style="
            font-size: 28px;
            font-weight: 900;
            color: #0f172a;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
          "
        >
          Terkirim!
        </h2>
        <p
          style="
            font-size: 16px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 32px;
            font-weight: 500;
          "
        >
          Terima kasih atas pertanyaannya! Kami akan segera membahasnya.
        </p>
        <button
          onclick="resetForm()"
          style="
            background: #f1f5f9;
            color: #334155;
            border: 2px solid transparent;
            padding: 14px 28px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
          "
          onmouseover="
            this.style.background = '#e2e8f0';
            this.style.color = '#0f172a';
          "
          onmouseout="
            this.style.background = '#f1f5f9';
            this.style.color = '#334155';
          "
        >
          Kirim Pertanyaan Lain
        </button>
      </div>
    </div>

    <script>
      const form = document.getElementById("questionForm");
      const submitBtn = document.getElementById("submitBtn");
      const submitText = document.getElementById("submitText");
      const loadingSpinner = document.getElementById("loadingSpinner");
      const successState = document.getElementById("successState");
      const header = document.querySelector(".header");
      const alertBox = document.getElementById("alertBox");

      window.resetForm = function () {
        successState.style.display = "none";
        form.style.display = "block";
        header.style.display = "block";
        form.reset();
        alertBox.className = "alert";
      };

      function showAlert(message, type) {
        alertBox.textContent = message;
        alertBox.className = `alert ${type}`;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const nama = document.getElementById("nama").value.trim();
        const pertanyaan = document.getElementById("pertanyaan").value.trim();

        if (!nama || !pertanyaan) {
          showAlert("Mohon lengkapi semua kolom.", "error");
          return;
        }

        // Loading state
        submitBtn.disabled = true;
        submitText.style.display = "none";
        loadingSpinner.style.display = "block";
        alertBox.className = "alert"; // hide alert

        try {
          const response = await fetch("/api/submit_question", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              nama: nama,
              pertanyaan: pertanyaan,
            }),
          });

          const result = await response.json();

          if (!response.ok) {
            throw new Error(
              result.error || "Terjadi kesalahan saat submit data.",
            );
          }

          // Jika sukses
          form.style.display = "none";
          header.style.display = "none";
          alertBox.style.display = "none";
          successState.style.display = "block";
          form.reset();
        } catch (error) {
          console.error(error);
          showAlert(`Gagal menyimpan: ${error.message}`, "error");
        } finally {
          // Reset button
          submitBtn.disabled = false;
          submitText.style.display = "block";
          loadingSpinner.style.display = "none";
        }
      });
    </script>
  </body>
</html>
