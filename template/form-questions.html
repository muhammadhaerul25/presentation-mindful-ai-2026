<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pertanyaan - GSA AI Forge 2026</title>
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4285F4;
            --success: #34A853;
            --error: #EA4335;
            --bg: #f0f4f8;
            --surface: #ffffff;
            --text: #1a1a1a;
            --text-muted: #5f6368;
            --border: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, hsla(217,100%,76%,0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(354,82%,73%,0.15) 0px, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: var(--surface);
            max-width: 500px;
            width: 100%;
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #1a73e8, #ea4335);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .header p {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group > label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #3c4043;
        }

        .form-group > label::after {
            content: " *";
            color: var(--error);
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border: 2px solid var(--border);
            border-radius: 12px;
            transition: all 0.2s ease;
            outline: none;
            background: #fafafa;
        }

        .form-control:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(66, 133, 244, 0.1);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            background-color: var(--primary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-submit:hover:not(:disabled) {
            background-color: #1a73e8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.25);
        }

        .btn-submit:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Loading Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                border-radius: 20px;
            }
            .header h1 {
                font-size: 22px;
            }
        }

        /* Success & Alert states */
        .alert {
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 24px;
            display: none;
        }
        .alert.error {
            background: #fce8e6;
            color: #d93025;
            display: block;
        }

        #successState {
            display: none;
            text-align: center;
            padding: 20px 0;
            animation: slideInUp 0.5s ease;
        }
        
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #e6f4ea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            color: #34A853;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Form Pertanyaan<br>GSA AI Forge 2026</h1>
            <p>Silakan tuliskan pertanyaan kita terkait materi presentasi hari ini.</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="questionForm">
            <div class="form-group">
                <label for="nama">Nama</label>
                <input type="text" id="nama" class="form-control" placeholder="Contoh: Budi Santoso" required>
            </div>

            <div class="form-group">
                <label for="pertanyaan">Tuliskan pertanyaan kita</label>
                <textarea id="pertanyaan" class="form-control" placeholder="Tuliskan pertanyaan kita di sini..." required></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span id="submitText">Kirim Pertanyaan</span>
                <div class="spinner" id="loadingSpinner"></div>
            </button>
        </form>

        <div id="successState">
            <div class="success-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <h2 style="font-size:24px;font-weight:800;color:#1a1a1a;margin-bottom:12px;">Pertanyaan Terkirim!</h2>
            <p style="font-size:15px;color:#5f6368;line-height:1.5;margin-bottom:24px;">Terima kasih atas pertanyaan kita. Kami akan membahasnya pada sesi tanya jawab.</p>
            <button onclick="resetForm()" style="background:#f1f3f4;color:#1a1a1a;border:none;padding:12px 24px;border-radius:100px;font-weight:600;font-size:14px;cursor:pointer;transition:all 0.2s;">
                Kirim Pertanyaan Lain
            </button>
        </div>
    </div>

    <script>
        const form = document.getElementById('questionForm');
        const submitBtn = document.getElementById('submitBtn');
        const submitText = document.getElementById('submitText');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const successState = document.getElementById('successState');
        const header = document.querySelector('.header');
        const alertBox = document.getElementById('alertBox');

        // Check if already submitted in this session (optional, for questions we might want multiple)
        // I'll allow multiple questions without blocking the view permanently.

        window.resetForm = function() {
            successState.style.display = 'none';
            form.style.display = 'block';
            header.style.display = 'block';
            form.reset();
            alertBox.className = 'alert';
        };

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = `alert ${type}`;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nama = document.getElementById('nama').value.trim();
            const pertanyaan = document.getElementById('pertanyaan').value.trim();

            if(!nama || !pertanyaan) {
                showAlert('Mohon lengkapi semua kolom.', 'error');
                return;
            }

            // Loading state
            submitBtn.disabled = true;
            submitText.style.display = 'none';
            loadingSpinner.style.display = 'block';
            alertBox.className = 'alert'; // hide alert

            try {
                const response = await fetch('/api/submit_question', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nama: nama,
                        pertanyaan: pertanyaan
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Terjadi kesalahan saat submit data.');
                }

                // Jika sukses
                form.style.display = 'none';
                header.style.display = 'none';
                alertBox.style.display = 'none';
                successState.style.display = 'block';
                form.reset();
                
            } catch (error) {
                console.error(error);
                showAlert(`Gagal menyimpan: ${error.message}`, 'error');
            } finally {
                // Reset button
                submitBtn.disabled = false;
                submitText.style.display = 'block';
                loadingSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
